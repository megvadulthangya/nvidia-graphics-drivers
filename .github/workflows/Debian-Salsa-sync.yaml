name: Sync 340xx/main and 390xx/main from Salsa Debian

on:
  schedule:
    - cron: '0 5 * * *'   # naponta 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GIT_HTTP_TIMEOUT: 300
      GIT_HTTP_LOW_SPEED_LIMIT: 500
      GIT_HTTP_LOW_SPEED_TIME: 60

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add Salsa remote
        run: |
          git remote remove salsa 2>/dev/null || true
          git remote add salsa https://salsa.debian.org/nvidia-team/nvidia-graphics-drivers.git

      - name: Fetch Salsa with retry
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 100
          retry_wait_seconds: 30
          command: git fetch salsa

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync 340xx/main branch (create if missing)
        run: |
          if git ls-remote --heads origin 340xx/main | grep -q 340xx/main; then
            git checkout -B 340xx/main origin/340xx/main
          else
            git checkout -B 340xx/main salsa/340xx/main
          fi
          git merge salsa/340xx/main --no-edit || true
          git push origin 340xx/main

      - name: Sync 390xx/main branch (create if missing)
        run: |
          if git ls-remote --heads origin 390xx/main | grep -q 390xx/main; then
            git checkout -B 390xx/main origin/390xx/main
          else
            git checkout -B 390xx/main salsa/390xx/main
          fi
          git merge salsa/390xx/main --no-edit || true
          git push origin 390xx/main
